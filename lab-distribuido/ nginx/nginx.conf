upstream workers {
    server worker1:5000;
    server worker2:5000;
    server worker3:5000;
}

server {
    listen 80;

    location / {
        proxy_pass         http://workers;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /nginx_status {
        stub_status on;
        allow all;
    }
}